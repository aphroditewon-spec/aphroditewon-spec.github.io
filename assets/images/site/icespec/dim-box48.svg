<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" font-family="'Noto Sans KR',system-ui,sans-serif">
  <!-- 박스 3면 -->
  <polygon points="70,220 220,220 220,95 70,95" fill="#eef4fb" stroke="#9db8d4" stroke-width="2"/>
  <polygon points="70,95 220,95 275,57 125,57" fill="#f7fbff" stroke="#9db8d4" stroke-width="2"/>
  <polygon points="220,95 275,57 275,182 220,220" fill="#dfeaf7" stroke="#9db8d4" stroke-width="2"/>
  <g stroke="#1e63e6" stroke-width="1.6" fill="none">
    <!-- 가로 310 -->
    <line x1="70" y1="238" x2="220" y2="238"/>
    <line x1="70" y1="232" x2="70" y2="244"/><line x1="220" y1="232" x2="220" y2="244"/>
    <!-- 세로(깊이) 310 -->
    <line x1="228" y1="224" x2="283" y2="186"/>
    <line x1="224" y1="219" x2="232" y2="229"/><line x1="279" y1="181" x2="287" y2="191"/>
    <!-- 높이 255 -->
    <line x1="293" y1="57" x2="293" y2="182"/>
    <line x1="287" y1="57" x2="299" y2="57"/><line x1="287" y1="182" x2="299" y2="182"/>
  </g>
  <g fill="#1e63e6" font-weight="700" font-size="15">
    <text x="145" y="258" text-anchor="middle">310 mm</text>
    <text x="270" y="222" text-anchor="middle">310 mm</text>
    <text x="305" y="124" text-anchor="start">255 mm</text>
  </g>
  <text x="190" y="288" text-anchor="middle" fill="#6b7684" font-size="12.5">※ 박스 규격 : 310 × 310 × 255 mm</text>
</svg>
